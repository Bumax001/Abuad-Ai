name: Unpack ABUAD AI Project

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for project ZIP
        id: check
        run: |
          if [ -f "ABUAD-AI-v4-enhanced.zip" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract project
        if: steps.check.outputs.found == 'true'
        run: |
          unzip -q "ABUAD-AI-v4-enhanced.zip" -d project_extract
          cp -R project_extract/. .
          rm -rf project_extract
          rm -f "ABUAD-AI-v4-enhanced.zip"

      - name: Clean unnecessary files
        if: steps.check.outputs.found == 'true'
        run: |
          find . -type d -name "__pycache__" -prune -exec rm -rf {} +
          find . -type f -name "*.pyc" -delete
          find . -type f -name ".env" -delete

      - name: Commit extracted project
        if: steps.check.outputs.found == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Extract ABUAD AI v4 project"
          git push
